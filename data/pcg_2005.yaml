    parent: 2
    description: |-
      Les amortissements des immobilisations sont portés au crédit des comptes 28 " Amortissements des immobilisations". Ces comptes sont subdivisés selon le même niveau de détail que les comptes principaux (20 et 21) sur lesquels ils portent.
