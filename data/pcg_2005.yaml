  - id: 43
    label: Organismes sociaux et compte rattachés
    parent: 4
    description: |-
      Les comptes 43 "Organismes sociaux et comptes rattachés " sont crédités respectivement du montant :
      • des sommes dues par l'entité à la Sécurité Sociale ainsi qu'aux différents organismes sociaux au titre des cotisations patronales d'assurances sociales, d'allocations familiales, d'accidents du travail, de retraites du personnel, … par le débit des comptes de charges par nature intéressés ;
      • des sommes à régler aux organismes susvisés pour le compte du personnel par le débit du compte " Personnel - rémunérations dues ".
      Ils sont débités des règlements effectués à ces organismes par le crédit d'un compte de trésorerie.
      Une subdivision du compte 43 " Organismes sociaux - charges à payer" est mouvementée à la clôture de l'exercice pour permettre l'enregistrement des charges et des produits rattachables à l'exercice
      clos (exemple : charges sociales patronales liées aux congés payés, aux primes d'intéressement ou aux gratifications à accorder au personnel).
      Lors du paiement effectif, ce compte est soldé en contrepartie des comptes des organismes sociaux concernés, les ajustements nécessaires étant enregistrés aux comptes intéressés. Ce compte peut aussi être contre-passé à l'ouverture de l'exercice qui suit.
