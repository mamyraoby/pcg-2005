  - id: 46
    label: Débiteurs divers et créditeurs divers
    parent: 4
    description: |-
      Ce compte peut présenter les subdivisions suivantes :
      • Créances sur cessions d'immobilisations ;
      • Créances sur cessions de titres de placement ;
      • Dettes sur acquisitions de titres de placement ;
      • Créances sur cessions des instruments de trésorerie ;
      • Dettes sur acquisitions des instruments de trésorerie ;
      • Divers - charges à payer et produits à recevoir.
      Le compte " Créances sur cessions d'immobilisations " est débité en contrepartie d'un compte " Prix de cession des immobilisations incorporelles et corporelles " (subdivision du compte 75, autres produits de gestion courante), il est crédité en contrepartie du compte de trésorerie, lors du règlement.
      Le compte " Créances sur cessions de titres de placement" est débité en contrepartie du compte 50 de titres de placement concernés (pour le prix de cession), il est crédité en contrepartie du compte de trésorerie, lors du règlement.
      Le compte " Dettes sur acquisitions de titres de placement" est crédité en contrepartie du compte 50 " Titres de placement" pour le coût d'acquisition des éléments visés, il est crédité en contrepartie du compte financier concerné, lors du règlement.
      Les comptes " Créances sur cessions des instruments de trésorerie " et "Dettes sur acquisitions des instruments de trésorerie" fonctionnent selon les mêmes modalités que les comptes relatifs aux créances et dettes relatives aux acquisitions ou cessions de titres de placement.
      Le compte " Divers - Charges à payer et produits à recevoir " est mouvementé à la clôture de l'exercice pour permettre l'enregistrement des charges et des produits rattachables à l'exercice clos. Ces comptes se présentent TVA incluse (le montant de la TVA attachée étant porté en contrepartie de la subdivision d'un compte 44 TVA). Lors du règlement effectif, ce compte est soldé en contrepartie des autres comptes 46 concernés, les ajustements nécessaires étant enregistrés aux comptes intéressés. Ce compte peut aussi être contre-passé à l'ouverture de l'exercice qui suit.
