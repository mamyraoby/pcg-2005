      label: Pertes de valeur sur valeurs en banque et établissements financiers
      parent: 59
    - id: 594
      label: Pertes de valeur sur régies d'avance et accréditifs
      parent: 59
- id: 6
  label: Comptes de charges
  parent: null
  description: |-
    Les produits et charges sont présentés dans le compte de résultat soit par fonction, soit par nature. Cependant, une ventilation des produits et charges en comptabilité par nature, sur la base d'une nomenclature de compte imposée, est obligatoire. Aussi, une entité qui présente un compte de résultat par fonction doit-elle présenter dans l'annexe une ventilation des produits et charges par nature, faisant apparaître les agrégats de gestion suivants : marge brute, valeur ajoutée et excédent brut d'exploitation. Les comptes prévus pour l'enregistrement comptable des charges par nature sont présentés ci-après.
    Cas de l'analyse des charges par fonction : Les mêmes principes s'appliquent au fonctionnement des comptes dans le cas où les charges et produits de l'entité font l'objet d'une analyse par fonction et non exclusivement par nature.
    L'analyse par fonction doit être opérée selon les spécificités propres à chaque entité. Les regroupements de charge rencontrés les plus fréquemment sont les suivants :
    • Regroupement par fonction économique ou par activités ; exemple : Achats, production, distribution, administration ;
    • Regroupement par moyen d'exploitation ; exemple : magasin, usine, bureau ;
    • Regroupement par produits ou services ; exemple : chantiers ou type de chantiers ;
    • Regroupement par centre de responsabilité ; exemple : direction générale, administration, direction commerciale, service études, service technique ;
    • Regroupement par zone géographique.
    Compte tenu de l'obligation de faire apparaître, soit dans le compte de résultat, soit dans l'annexe aux états financiers des informations concernant le montant de certaines charges par nature, le suivi des comptes de charge par fonction est le plus souvent effectué par une méthode de codification multiple : chaque charge fait l'objet, lors de son enregistrement en comptabilité d'une double imputation sur la base d'une codification par nature d'une part, et d'une codification par fonction, d'autre part.
