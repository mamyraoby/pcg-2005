  - id: 16
    label: Emprunts et dettes assimilés
    parent: 1
    description: |-
      Spécificités communes à ces deux catégories de compte : L'utilisation de ces comptes est limitée aux opérations financières, à l'exclusion des opérations commerciales portés au passif du bilan, en distinguant :
      - les opérations qui relèvent des passifs courants et celles qui relèvent des passifs non courants ;
      - les opérations portant intérêts et celles ne portant pas intérêts.
      Ces comptes peuvent également être subdivisés, sur l'initiative de l'entreprise, en distinguant :
      - les opérations faites localement et celles réalisées à l'étranger ;
      - les opérations réalisées en monnaie nationale et celles réalisées en devises.
      A la clôture de l'exercice, les intérêts courus non échus relatifs à ces emprunts et dettes sont inscrits dans des subdivisions de chacun des comptes de dettes visées.
      Les remboursements en capital de ces emprunts et dettes sont enregistrés au débit de chacun des comptes concernés, en contrepartie des comptes de tiers ou de trésorerie utilisés.
      Les emprunts sont comptabilisés à leur coût, qui correspond à la juste valeur de la contrepartie reçue, après déduction éventuelle des frais d'émission et hors éventuelles primes d'émission et de remboursement. Les primes d'émission et de remboursement ainsi que les frais sur emprunts sont comptabilisés au bilan au compte emprunt correspondant de manière progressive sur la durée de l'emprunt. Cet amortissement est déterminé selon un calcul actuariel et enregistré au débit d'un compte de dotations financières. La dette inscrite en contrepartie de la disposition d'un actif pris par un contrat de location financement ainsi que les dépôts et cautionnements reçus figurent également dans des subdivisions de ce compte 16 " Emprunts et dettes assimilés ". A la clôture de l'exercice, les frais courus non échus relatifs à ces emprunts (intérêts, dotations correspondant à l'amortissement des primes d'émission, primes de remboursement et frais d'émission) sont inscrits dans des subdivisions de chacun des comptes de dettes visées. Les remboursements en capital de l'ensemble de ces emprunts et dettes sont enregistrés au débit de chacun des comptes visés, en contrepartie des comptes de tiers ou de trésorerie utilisés.
