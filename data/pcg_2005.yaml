  - id: 49
    label: Pertes de valeur sur compte de tiers
    parent: 4
    description: |-
      Lors de leur constitution, les pertes de valeur sur comptes de tiers sont créditées aux comptes 49 créés par nature de créances concernées :
      • pertes de valeur sur comptes de clients ;
      • pertes de valeur sur comptes de groupe et associés ;
      • pertes de valeur sur comptes de débiteurs divers. En contrepartie, les comptes de dotations sont débités.
      Le compte de perte de valeur relatif à chaque compte de tiers est réajusté à la fin de chaque exercice par :
      • le débit des comptes de dotations correspondants, lorsque le montant de la perte de valeur doit être augmenté ;
      • le crédit d'un compte 78 " Reprises sur pertes de valeur et provision" lorsque le montant de la perte de valeur doit être diminué ou annulé (perte de valeur devenue, en tout ou partie, sans objet).
