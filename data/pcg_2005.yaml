  - id: 40
    label: Fournisseurs et comptes rattachés
    parent: 4
    description: |-
      Figurent sous le compte 40, les dettes et avances de fonds liées à l'acquisition de biens ou de services. Selon les besoins, des subdivisions du compte 40 peuvent être ouvertes telles que :
      • fournisseurs de biens et services ;
      • effets à payer ;
      • fournisseurs, emballages et matériels à rendre ;
      • fournisseurs, charges à payer ;
      • rabais, remises, ristournes et autres avoirs à recevoir ;
      • avances et acomptes versés sur commandes.
      La subdivision du compte 40 " Fournisseurs de biens et services " :
      • est créditée du montant des factures d'achats de biens ou de prestations de services par le débit :
      - des comptes concernés de la classe 6 (montant hors taxes récupérables),
      - d'une subdivision du compte 40 pour les créances au titre des emballages et matériels à rendre,
      - d'une subdivision du compte 44 " TVA déductible " pour le montant des taxes récupérables ;
      • est débitée par le crédit :
      - d'un compte de trésorerie lors des règlements effectués par l'entité à ses fournisseurs,
      - d'un compte de classe 6 pour le montant des factures d'avoir reçues à l'occasion de retour de marchandises au fournisseur ou des rabais, remises et ristournes obtenues (et du compte de TVA concerné),
      - d'un compte " Effets à payer sur biens et services " (subdivision du compte 40) lors de l'acceptation d'une lettre de change ou de la remise d'un billet à ordre.
      Les comptes " Effets à payer " sont soldés par un compte de trésorerie lors de leur paiement (ou sont ré imputés aux comptes " Fournisseurs
      de biens et services " concernés en cas de non-paiement à l'échéance). Le compte " Fournisseurs - Charges à payer " est crédité à la clôture de l'exercice du montant, TVA comprise, des factures imputables à la période close mais non encore parvenues, dont le montant est suffisamment connu et évaluable, par le débit des comptes concernés de la classe 6. La subdivision du compte " Rabais, remises, ristournes à obtenir et autres avoirs non encore reçus " est débitée à la clôture de l'exercice du montant, TVA comprise, des avoirs imputables à la période close mais non encore parvenus, dont le montant est suffisamment certain et évaluable, par le crédit des comptes concernés des classes 4 et 6. La subdivision du compte 40 qui enregistre les avances et acomptes versés sur commandes est débitée, lors du paiement par l'entité d'avances sur commandes passées auprès des fournisseurs, par le crédit d'un compte de trésorerie. Il est crédité par le débit du compte fournisseurs. Les avances et acomptes versés sur commandes d'immobilisations sont imputés au débit du compte 23, et non à une subdivision du compte 40 " avances et acomptes versés ". La subdivision du compte 40 qui enregistre les créances pour emballages et matériels à rendre est débitée par le crédit du compte “Fournisseurs " lors de la consignation par les fournisseurs à l'entité d'emballages ou de matériels pour le montant de la consignation.
