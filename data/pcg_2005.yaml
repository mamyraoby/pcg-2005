  - id: 66
    label: Charges financières
    parent: 6
    description: |-
      Ce compte peut être subdivisé en fonction des besoins en information afin de faire apparaître la nature ou l'origine des charges :
      • charges d'intérêts ;
      • moins-values de cession sur instruments financiers ;
      • moins-values sur titres de placement ;
      • autres charges financières tels qu'amortissements des primes de remboursement, des primes d'émission et des frais accessoires sur émission d'emprunt.
      Le compte " Charges d'intérêts " est débité de l'ensemble des intérêts se rapportant à la période comptable sur emprunts, dettes et opérations de financement (par exemple : escompte d'effets à recevoir en portefeuille). Le compte " Moins-values sur titres de placement " est débité en
      contrepartie du solde du compte 50 :
      • lors de la cession de titres de placement faisant apparaître des moins-values ;
      • à la clôture de l'exercice, lorsque des titres de placement immédiatement négociables (évalués à la valeur de marché) font apparaître une moins value (moins value déterminée par différence entre la valeur comptable et la valeur de marché).
      Le compte " Autres charges financières " comprend notamment à son débit :
      • les moins-values de cession des instruments de trésorerie ;
      • les moins-values entre valeur comptable et valeur de marché des instruments de trésorerie immédiatement négociables, évalués à ladite valeur de marché.
