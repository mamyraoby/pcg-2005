  - id: 52
    label: Instruments de trésorerie
    parent: 5
    description: |-
      Lors de l'acquisition des instruments de trésorerie, le coût d'acquisition est enregistré au débit du compte 52 " Instruments de trésorerie ", en distinguant éventuellement dans des sous comptes la nature de ces instrument (instruments financiers immédiatement négociables sur un marché assurant la liquidité et la sécurité des transactions, instruments de couverture, autres instruments financiers), en contrepartie des comptes d'instruments de trésorerie et assimilés concernés.
      Pour les instruments financiers immédiatement négociables qui sont évalués à la valeur de marché à la date de clôture des comptes, la différence entre cette valeur et la valeur des titres figurant en comptabilité est enregistrée :
      • au débit du compte 52 en contrepartie d'un compte " Autres produits financiers " (subdivision du compte 76), s'il s'agit d'une plus-value ;
      • au crédit du compte 52 en contrepartie d'un compte " Autres charges financières " (subdivision du compte 66), s'il s'agit d'une moins-value.
      En cas de cession des instruments financiers : le solde du compte 52 (valeur comptable au débit et prix de cession au crédit) est viré :
      • en contrepartie du débit d'une subdivision du compte 66 " Autres charges financières ", s'il s'agit d'une moins-value de cession ;
      • en contrepartie du crédit d'une subdivision du compte 76 " Autres produits financiers ", s'il s'agit d'une plus-value de cession.
  - id: 53
    label: Caisse
    parent: 5
    description: Ce compte est débité du montant des espèces encaissés par l'entité. Il est crédité du montant des espèces décaissés. Son solde est toujours débiteur ou nul.
  - id: 54
    label: Régies d'avance et accréditifs
    parent: 5
    description: |-
      Le compte 54 " Régies d'avances et accréditifs " enregistre, le cas échéant, les écritures relatives aux fonds gérés par les régisseurs ou les comptables subordonnés et aux accréditifs ouverts dans les banques au nom d'un tiers ou d'un agent de l'entité.
      Ce compte est débité du montant des fonds remis aux régisseurs et aux titulaires d'accréditifs par le crédit d'un compte de trésorerie. Il est crédité :
      • du montant des dépenses effectuées pour le compte de l'entité par le débit d'un compte de tiers ou de charges ;
      • du montant des reversements de fonds avancés, par le débit d'un compte de trésorerie.
