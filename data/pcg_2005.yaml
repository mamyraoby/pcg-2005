  - id: 13
    label: Produits et charges différés - hors cycle d'exploitation
    parent: 1
    description: |-
      Sont généralement inscrits au crédit de ces comptes :
      - les subventions d'équipement ;
      - les autres subventions d'investissement ;
      - les impôts différés passifs.
      Sont généralement inscrits au débit de ces comptes :
      - les impôts différés actifs.
      Les subventions d'équipement sont des subventions dont bénéficie l'entité en vue d'acquérir ou de créer des biens déterminés.
      Ces comptes sont crédités du montant de la subvention accordée par le débit d'un compte :
      - classe 2, lorsque la subvention correspond à un transfert gratuit d'immobilisations à l'entité ;
      - classe 4, compte de tiers (financement en attente), lorsque la subvention donne lieu à un mouvement financier.
      Les autres subventions d'investissement correspondent à des subventions dont bénéficie l'entité pour financer ses activités à long terme : implantation à l'étranger, prospection d'un nouveau marché…
      Les subventions d'investissement font l'objet d'une reprise annuelle selon les modalités prévues par le présent Plan Comptable Général. Seul figure au bilan le montant net de la subvention non encore inscrite au compte de résultat.
