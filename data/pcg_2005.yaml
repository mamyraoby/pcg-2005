    label: Ventes des produits fabriqués, marchandises, prestations
    parent: 7
    description: |-
      Les ventes sont enregistrées au crédit des comptes par nature, pour leur prix net de TVA collectée, déduction faite des rabais, remises et ristournes accordés.
      En fonction des besoins de l'entité, les comptes de vente sont subdivisés pour distinguer par exemple :
      • les groupes de produits ;
      • les ventes à l'étranger et les ventes locales ;
      • les cessions à prix coûtant ;
      • les ventes au sein du groupe et les ventes hors groupe ;
      • les ventes liées à l'activité principale et les produits liés à des activités annexes.
      Les produits des activités annexes peuvent comprendre les produits des services exploités dans l'intérêt du personnel (restaurant, transport, logement…), des locations diverses, des mises à disposition de personnel, des frais de port ou autres frais accessoires facturés, des bonis sur reprises d'emballages consignés, des cessions d'approvisionnement,….
