  - id: 50
    label: Valeurs mobilières de placement
    parent: 5
    description: |-
      Les comptes "Titres de placements" sont débités du coût d'acquisition des titres, en contrepartie des comptes de tiers ou de trésorerie concernés. En cas de titres de placement dont la valeur nominale est partiellement libérée, la valeur totale est portée au débit de ces comptes, la partie non appelée étant inscrite au crédit dans une subdivision du compte 50 " Versements à effectuer sur titres de placement non libérés " (ce compte étant ensuite soldé au fur et à mesure des montants appelés versés, en contrepartie des comptes de trésorerie).
      Les titres de placement sont des actifs financiers détenus à des fins de transaction et évalués à chaque clôture d'exercice à la juste valeur. La différence entre cette juste valeur et la valeur des titres figurant en comptabilité est enregistrée :
      • au débit du compte 50 en contrepartie d'un compte " Plus-values sur titres de placement " (subdivision d'un compte 76), s'il s'agit d'une plus-value ;
      • au crédit du compte 50 en contrepartie du compte " Moins-values sur titres de placement ", (subdivision d'un compte 66), s'il s'agit d'une moins-value.
      En cas de cession des titres de placement, le solde du compte 50 (valeur comptable au débit et prix de cession au crédit) est viré :
      • en contrepartie du débit d'un compte de charges financières " Moins-values sur titre de placement ", s'il s'agit d'une moins-value de cession ;
      • en contrepartie du crédit d'un compte de produits financiers " Plus-values sur titres de placement ", s'il s'agit d'une plus-value de cession.
      A la clôture de l'exercice, les intérêts courus non échus sur les titres de placement sont portés au débit d'un compte " Intérêts courus sur titres de placement" (subdivision du compte 50). Ce compte est soldé à l'échéance définitive.
