  - id: 21
    label: Immobilisations corporelles
    parent: 2
    description: |-
      Les comptes d'immobilisations corporelles sont débités à la date de leur prise de contrôle par l'entité :
      - de la valeur d'apport ;
      - du coût d'acquisition ;
      - du coût de production, par le crédit, suivant le cas :
      - d'un compte " Capital " (subdivision compte 10) ou du compte " Associés - opérations sur le capital " (subdivision compte 45 Groupe & associés) ;
      - d'un compte 40 " Fournisseurs" ou autres comptes concernés ;
      - d'un compte 72 - " Production immobilisée ". Les éléments suivants peuvent être distingués s'ils sont d'un montant significatif :
      - terrains ;
      - constructions ;
      - installations techniques ;
      - installations générales, agencements, aménagements ;
      - matériels de transport ;
      - matériels de bureau, matériels informatiques et mobilier de bureau ;
      - emballages récupérables ;
      - autres immobilisations corporelles. Les profits ou les pertes provenant de la mise hors service ou de la sortie d'une immobilisation corporelle sont déterminés par différence entre les produits de sortie nets estimés et la valeur comptable de l'actif et sont comptabilisés en produits ou en charges dans le compte de résultat dans les comptes 65 (subdivision pertes sur sorties d'actifs immobilisés) ou 75 (subdivision profits sur sorties d'actifs immobilisés).
