  - id: 71
    label: Production stockées (ou déstockage)
    parent: 7
    description: |-
      Le compte 71 est réservé à l'enregistrement des variations de la production stockée. Les variations des stocks d'approvisionnement et de marchandises sont, pour leur part, portées au compte 603 " Variation des stocks (approvisionnements et marchandises) ".
      Dans le cadre d'un inventaire intermittent, ces comptes de variation des stocks sont débités de la valeur de la production stockée initiale et crédités de la valeur de la production stockée finale. En conséquence,
      le solde du compte 71 représente la variation globale de la production stockée (solde créditeur) ou déstockée (solde débiteur) entre le début et la fin de la période.
      Les comptes 71 figurent en compte de résultat sous la rubrique “produits”.
