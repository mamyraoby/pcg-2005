- id: 3
  label: Comptes de stocks et d'en-cours
  parent: null
  description: |-
    Deux critères de classement sont généralement retenus dans le cadre de la nomenclature des comptes de stocks :
    • l'ordre chronologique du cycle de production (approvisionnements, en cours de production, production stockée, marchandises revendues en l'état) ;
    • la nature de l'actif stocké, qui doit faire l'objet d'une ventilation au sein de chaque entité selon ses besoins internes de gestion.
    Au niveau comptable, on retient la distinction entre :
    • les approvisionnements et marchandises achetés (matières premières, matières consommables, fournitures consommables, emballages) ;
    • d'autre part, les produits fabriqués par l'entreprise ou en cours d'élaboration (produits finis, produits intermédiaires, produits résiduels, en cours).
    Le choix de la méthode de suivi en comptabilité des stocks (méthode de l'inventaire permanent ou méthode de l'inventaire intermittent), relève d'une décision de gestion.
    a. Comptabilisation dans le cadre de l'inventaire intermittent
    • Enregistrement des approvisionnements et marchandises consommés :
    - Au cours de la période, les achats sont enregistrés au débit des comptes 60 Achats consommés, par le crédit d'un compte de fournisseurs ou d'un compte de trésorerie.
    - Le compte 60 peut être subdivisé selon le même schéma que les comptes de stocks (607 Marchandises , 601 Matières premières et fournitures, 602 Autres approvisionnements).
    - A la clôture de la période, après avoir procédé à un inventaire extra comptable, il convient :
    . de procéder à l'annulation du stock de début de période (crédit des comptes 37 "Marchandises ", 31 " Matières premières et fournitures " et 32 " Autres approvisionnements "
    par le débit d'une subdivision du compte 60 (sous comptes 603 " Variations des stocks "),
    . de constater le stock de fin de période par le débit des comptes stocks et le crédit des sous comptes 603 " Variation des stocks " correspondant.
    • Enregistrement des produits fabriqués ou en cours de fabrication
    - En cours de période, aucune écriture spécifique n'est enregistrée en classe 3 (les éléments nécessaires à la production sont enregistrés dans les comptes de charges par nature).
    - En fin de période, après avoir procédé à un inventaire extra-comptable, il convient, comme pour l'enregistrement des approvisionnements et marchandises consommés :
    . de procéder à l'annulation du stock de début de période : crédit des comptes 33 " En cours de production de biens ", 34 " En cours de production de services " et 35 " Stocks de produits " par le débit des comptes 71 " Production stockée ou déstockage " correspondant ;
    . de constater le stock de fin de période par le débit des comptes stocks et le crédit des comptes 71 correspondant.
    b. Cas de l'inventaire permanent
    La méthode de l'inventaire permanent permet un suivi comptable des stocks et favorise l'arrêté rapide des situations comptables périodiques. Il permet également au niveau des produits finis d'établir une correspondance directe entre les coûts des stocks vendus et les revenus y afférents.
    • Enregistrement des approvisionnements et marchandises consommés :
    - Au cours de la période :
    . les achats sont enregistrés comme dans le cadre de l'inventaire intermittent au débit des comptes 60 Achats consommés, par le crédit d'un compte de fournisseurs ou d'un compte de trésorerie ;
    . les comptes de stocks fonctionnent comme des comptes de magasins : ils sont débités des entrées en magasin par le crédit des sous comptes 603 " Variations des stocks ", et ils sont crédités des sorties par le débit de ces mêmes comptes 603.
    - En fin de période, après analyse, les écarts éventuels entre le stock physique, évalué de façon extra comptable et le stock figurant au débit des comptes 37, 31 ou 32 en comptabilité sont enregistrés afin de porter le montant de ces derniers à la valeur constatée dans l'inventaire physique.
    • Enregistrement des produits fabriqués ou en cours de fabrication
    - Au cours de la période, les comptes de stocks (35 " Stocks de produits " et éventuellement 34 " En cours de production de services " et 33 " En cours de production de biens ") fonctionnent comme des comptes de magasin : ils sont débités des entrées en magasin par le crédit des comptes 71 " Production stockée ou déstockage ", et sont crédités des sorties par le débit de ces mêmes comptes 71.
    - En fin de période, après analyse, les écarts éventuels entre le stock physique, évalué de façon extra comptable, et le stock figurant au débit des comptes 33, 34 ou 37 en comptabilité, sont enregistrés afin de porter le montant de ces derniers à la valeur constatée dans l'inventaire physique. Ces boni et mali d'inventaire sont généralement enregistrés également en compte 71 “ Production stockée ou déstockage ”.
