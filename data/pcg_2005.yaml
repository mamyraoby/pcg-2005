  - id: 42
    label: Personnels et comptes rattachés
    parent: 4
    description: |-
      Selon les besoins de la gestion et de l'information financière, des subdivisions du compte 42 peuvent être ouvertes telles que :
      • Personnel - rémunérations dues ;
      • Personnel - avances et acomptes ;
      • Personnel - oppositions sur salaires ;
      • Personnel - fonds des œuvres sociales ;
      • Personnel, charges à payer (Débit) ou charges comptabilisées d'avance (Crédit).
      Rémunérations du personnel Le compte " Personnel - rémunérations dues " est crédité des rémunérations brutes à payer au personnel par le débit des comptes de charges intéressés (641 Rémunérations du personnel). Il est débité :
      • du montant des avances et acomptes versés au personnel par le crédit du compte 42 - " Personnel - avances et acomptes " (cas de l'imputation de tout ou partie des avances et acomptes versés) ;
      • du montant des oppositions notifiées à l'entité à l'encontre des membres de son personnel par le crédit du compte 42 - " Personnel - oppositions " ;
      • de la quote-part des charges sociales incombant au personnel par le crédit du compte 43 - " Organismes sociaux et comptes rattachés " ;
      • du montant des règlements effectués au personnel par le crédit d'un compte de trésorerie.
      Autres méthodes de comptabilisation des rémunérations du personnel : Les comptes 42 " Personnel - rémunérations dues ", peuvent également n'enregistrer que le montant net à payer (et non le brut) au vu des bulletins de paye. Dans le cadre de cette méthode, les comptes de charges 64 (sous compte 641 rémunérations du personnel) sont alors crédité des comptes ouverts à chacun des tiers bénéficiaires : 421 Rémunérations du personnel (montant net à payer) ; 425 Avances et acomptes au personnel ; 427 Personnel - oppositions ; 43 Organismes sociaux et comptes rattachés (part salariale et part patronale figurant dans la rémunération brute).
      Le compte "Personnel - oppositions" est crédité du montant des sommes faisant l'objet d'oppositions obtenues par des tiers à
      l'encontre de membres du personnel de l'entité, par le débit du compte " Personnel, rémunérations dues ". Il est débité du montant desdites sommes, lors de leur versement aux tiers bénéficiaires de l'opposition, par le crédit d'un compte de trésorerie.
      Le compte " Œuvres sociales " est crédité du montant des sommes mises à la disposition des œuvres au personnel (cantines, comités d'entreprises, …) par le débit du compte des charges sociales. Il est débité du montant des versements effectués à ces œuvres sociales par le crédit d'un compte de trésorerie.
      Le compte " Personnel - charges à payer " est mouvementé à la clôture de l'exercice pour permettre l'enregistrement des charges et des produits rattachables à l'exercice clos (exemples : dettes de l'entité envers son personnel au titre des congés à payer, des primes d'intéressement ou des gratifications à accorder, enregistrées au crédit du compte en contrepartie du compte de charges de personnel).
      Lors du paiement effectif, le compte " Personnel - charges à payer " est soldé en contrepartie du compte " Personnel, rémunérations dues”, les ajustements nécessaires étant enregistrés aux comptes intéressés. Ce compte peut aussi être contre-passé à l'ouverture de l'exercice qui suit.
