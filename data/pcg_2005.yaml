  - id: 45
    label: Groupes et assoicués
    parent: 4
    description: |-
      Ce compte peut présenter les subdivisions suivantes :
      • Groupe ;
      • Associés - comptes courants ;
      • Associés - opérations sur le capital ;
      • Associés - dividendes à payer ;
      • Associés - opérations faites en commun ou en groupement.
      Le compte “Groupe et associés” ne doit pas enregistrer les opérations effectuées en tant que fournisseur ou client qui sont inscrites respectivement aux comptes 40 " Fournisseurs " ou 41 " Clients ".
      Le compte " Groupe " enregistre à son débit le montant des fonds avancés directement ou indirectement de façon temporaire par l'entité aux entités du groupe, et à son crédit le montant des fonds mis directement ou indirectement à disposition de l'entité par les entités du groupe.
      Le compte 455 "Associés - comptes courants" enregistre à son crédit le montant des fonds mis ou laissés temporairement à la disposition de l'entité par les associés. Des subdivisions pour les " Intérêts courus " doivent recevoir à la clôture de l'exercice le montant des intérêts courus non échus.
      Le compte " Associés - opérations sur le capital" est destiné à recevoir le montant des apports effectués par les associés (au crédit). Il est soldé par les comptes de capitaux intéressés.
      Le compte "Associés - dividendes à payer " est crédité du montant des dividendes dont la distribution a été décidée par les organes compétents, par le débit selon le cas :
      • du compte 12 " Résultat de l'exercice " ;
      • du compte 10 " Réserves " ;
      • du compte 11 " Report à nouveau ".
      Le compte " Associés - opérations faites en commun ou en groupement" enregistre les opérations faites en commun.
