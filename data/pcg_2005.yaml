  - id: 44
    label: Etat, collectivités publiques, organismes internationaux
    parent: 4
    description: |-
      D'une manière générale , les opérations à inscrire au compte 44 " Etat, collectivités publiques, organismes internationaux et comptes rattachés " sont celles qui sont faites avec des entités à caractère officiel, considérées en tant que puissance publique. Par conséquent les ventes et les achats conclus avec ces entités à des conditions courantes et normales s'inscrivent au compte 40 " Fournisseurs et comptes rattachés " et 41 " Clients et comptes rattachés " au même titre que les opérations faites avec les autres fournisseurs et les autres clients.
      Ce compte peut être subdivisé en fonction des besoins en sous comptes tels que :
      • Etat, impôt sur les bénéfices ;
      • Etat, taxe sur la valeur ajoutée ;
      • Etat et autres collectivités publiques, subventions à recevoir ;
      • Etat - autres impôts et taxes ;
      • Organismes Internationaux ;
      • Etat - charges à payer et produits à recevoir ;
      • Etat - Impôt différé.
      Le compte " Etat, impôt sur les bénéfices " est crédité du montant de l'impôt sur les bénéfices exigible en contrepartie des comptes 69. Il est débité du montant des règlements effectués, en contrepartie d'un compte de trésorerie.
      Le compte " Etat - taxe sur la valeur ajoutée " reçoit :
      • d'une part, le montant de la TVA collectée pour le compte de l'Etat (en contrepartie des ventes effectuées et des livraisons effectuées à soi-même) ;
      • d'autre part, le montant de la TVA à récupérer selon les dispositions légales en contrepartie des achats effectués.
      Au moment de leur exigibilité, les subdivisions " TVA collectée " et " TVA déductible " sont soldées :
      • soit en contrepartie de la subdivision du compte 44 - " TVA à payer” s'il en résulte un solde créditeur ;
      • soit en contrepartie de la subdivision du compte 44 "Crédit de TVA”, s'il en résulte un solde débiteur à récupérer ultérieurement (par imputation sur la TVA à payer ou par demande de remboursement effectif).
      Une subdivision du compte 44 " TVA à régulariser " est destinée à recevoir le montant de TVA déductible sur les charges à payer inscrites aux comptes de tiers concernés et le montant de la TVA collectée sur les produits à recevoir inscrits aux comptes de tiers concernés.
      Cette subdivision fait l'objet d'un virement aux subdivisions "TVA collectée " et " TVA déductible " lors de leur fait générateur fiscal, compte tenu des ajustements nécessaires enregistrés aux comptes intéressés. Ce compte peut aussi être contre-passé à l'ouverture de l'exercice qui suit.
      La subdivision du compte 44 “Etat et autres collectivités publiques - subventions à recevoir “ est débitée en fin d'exercice des subventions acquises mais non encore encaissées par le crédit d'un compte de produits (subventions d'exploitation) ou de produits comptabilisés d'avance (subvention d'investissement).
      Ce compte est soldé en contrepartie d'un compte de trésorerie lors de la perception des montants concernés.
      Les subventions publiques doivent normalement être comptabilisées en produits sur l'exercice auquel se rattachent les coûts qu'elles sont censées compenser.
      Cependant, ce rattachement n'autorise pas la comptabilisation en subventions à recevoir de subventions non encore acquises, c'est à dire qui ne correspondent pas à une obligation pour la partie versante ou pour lesquelles l'entreprise ne répond pas encore aux conditions d'octroi à la clôture de l'exercice
      Les comptes " Etat - autres impôts et taxes " sont crédités du montant de tous les autres impôts et taxes versés par l'entité, par le débit des
      comptes de charges intéressés. Ils sont débités du montant, des règlements effectués, en contrepartie d'un compte de trésorerie.
      Une subdivision du compte 44 “organismes internationaux” doit être ouverte par les entités, généralement des ONG, qui concluent des conventions de financement de projet directement avec des organismes internationaux ou avec l'Etat. Sont alors comptabilisées dans cette subdivision du compte 44, toutes les opérations effectuées avec ces organismes, à l'exception de celles faites en tant que fournisseur ou client qui sont inscrites respectivement aux comptes 40 " Fournisseurs " ou 41 " Clients ".
      Dans ce contexte, le mode de fonctionnement de ce compte dépend des clauses contractuelles et de l'organisation comptable prévue dans le cadre de la convention conclue avec l'organisme, et de la nature du projet financé ; en effet l'entité peut soit agir en son propre nom, soit agir en simple mandataire du bailleur de fonds.
      Les comptes " Etat - charges à payer et produits à recevoir " sont mouvementés à la clôture de l'exercice pour permettre l'enregistrement des charges et des produits rattachables à l'exercice clos (exemple : charges fiscales patronales liées aux congés à payer, aux primes d'intéressement ou aux gratifications à accorder au personnel).
      Lors du paiement effectif, ces comptes sont soldés en contrepartie des comptes 44 concernés , les ajustements nécessaires étant enregistrés aux comptes intéressés. Ces comptes peuvent aussi être contre-passés à l'ouverture de l'exercice qui suit.
      Les comptes " Etat - impôt différé " sont destinés à recevoir le montant calculé d'impôt différé. Ils enregistrent les impositions différées actives et passives déterminées à chaque clôture d'exercice sur la base de la réglementation fiscale en vigueur à la date de clôture, sans calcul d'actualisation, et résultant :
      • d'un décalage temporaire entre la constatation d'un produit ou d'une charge en comptabilité et sa prise en compte dans la base fiscale ;
      • de déficits fiscaux ou de crédits d'impôts reportables dans la mesure où leur imputation sur des bénéfices fiscaux ou des impôts futurs est probable.
      Au niveau des états financiers, il est nécessaire de présenter distinctement :
      • les actifs et passifs d'impôt des autres actifs et passifs,
      • les charges (et produits) d'impôt des autres charges (et produits),
      • les actifs, passifs, charges et produits d'impôt différé des actifs, passifs, charges et produits d'impôt exigible.
      Une compensation débit / crédit est possible au niveau de la présentation du bilan et du compte de résultat uniquement lorsque :
      • les débits et les crédits relèvent de la même administration fiscale pour la même entité imposable ;
      • il existe un droit juridiquement exécutoire de compenser compte tenu de la nature et de l'origine de l'impôt concerné.
