- id: 1
  label: Compte de capitaux
  parent: null
  children:
  - id: 10
    label: Capital, réserves et assimilés
    parent: 1
    description: |-
      Ce compte est subdivisé en sous comptes différents selon la forme juridique sous laquelle s'exerce l'activité de l'entité :
      - capital (social ou individuel selon la forme juridique de l'entité) ;
      - compte de l'exploitant ;
      - capital non appelé ;
      - actions propres (auto contrôle) ;
      - réserves (légale, statutaire, ordinaire) ;
      - écarts d'évaluation. Les apports et les bénéfices accumulés sont enregistrés dans les conditions suivantes :
      • Comptes à l'usage de l'exploitant individuel Le sous compte " Capital individuel " enregistre à son crédit :
      . la valeur des apports de l'entrepreneur au début ou en cours d'activité,
      . le bénéfice de l'exercice précédent (par le débit du compte 12 - " Résultat de l'exercice "). Il enregistre à son débit :
      . les prélèvements de toute nature,
      . la perte de l'exercice précédent (par le crédit du compte 12). Les apports ou les retraits personnels de l'exploitant et, le cas échéant, l'enregistrement de la rémunération " normale " attachée à son travail sont enregistrés au cours de l'exercice dans un compte dénommé " Compte de l'exploitant ". A l'ouverture de l'exercice suivant, le solde de ce compte est viré au compte " Capital individuel ".
      • Comptes à l'usage des sociétés de capitaux Dans les sociétés privées, le capital représente la valeur nominale des actions ou des parts sociales. Dans les sociétés publiques, le capital représente la contrepartie des apports en nature ou en espèces effectués par l'Etat ou les collectivités publiques et dont le remboursement n'est pas prévu par une convention.
      Le sous compte "Capital social" enregistre à son crédit le montant du capital figurant dans l'acte de société. Il retrace l'évolution de ce montant au cours de la vie de la société suivant les décisions des organes compétents.
      Il est crédité lors de l'augmentation du capital :
      . du montant des apports en espèces ou en nature effectués par les associés (sous déduction des primes liées au capital social, celles-ci étant enregistrées au crédit d'une subdivision distincte du compte "capital et réserves ") ;
      . du montant des réserves. Il est débité des réductions de capital, quelle qu'en soit la cause (absorption des pertes, remboursement aux associés, …).
      En cas d'appel fractionné du capital social, la quote-part non appelée est inscrite au compte "Capital social" par le débit d'un compte "Capital non appelé " (subdivision également du compte 10 "Capital et réserves").
      Le solde débiteur de ce compte "Capital non appelé " représente la créance de la société sur les associés et figure sous une rubrique particulière à l'actif du bilan.
      Les actions rachetées par l'entreprise en vue d'être annulées, d'être conservées ou de permettre la régularisation des cours boursiers doivent être présentées au bilan sur une rubrique particulière, en déduction des capitaux propres, pour leur valeur d'acquisition. Leur acquisition est comptabilisée dans les états financiers comme une variation des capitaux propres, et est enregistrée au débit d'un compte " Actions propres ", subdivision du compte 10 " Capital et réserves ".
      Les réserves à inscrire au crédit des subdivisions du compte 10 " Capital et réserves " sont, en principe, des bénéfices affectés durablement à l'entité jusqu'à décision contraire des organes compétents.
      Ces comptes de réserves sont débités des incorporations au capital, des distributions aux associés, des prélèvements pour l'apurement des pertes,…
      Les sous-comptes écart d'évaluation enregistrent les écarts dégagés lors d'une évaluation d'un actif à sa juste valeur, dans le cas où la réglementation prévoit l'enregistrement de ces écarts directement en capitaux propres et non dans des comptes de résultat.
