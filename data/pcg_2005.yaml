  - id: 20
    label: Immobilisations incorporelles
    parent: 2
    description: |-
      Une subdivision du compte 20 enregistre à son débit les frais de développement qui doivent être inscrits à l'actif dans les conditions fixées par le présent Plan Comptable Général, en contrepartie d'un compte 72 " Production immobilisée d'actif incorporel " (après enregistrement des charges les concernant dans les comptes par nature).
      Lorsque les frais de développement sont totalement amortis (au terme du délai prévu ou par un amortissement accéléré du fait de l'échec des projets visés), le compte " Amortissements des frais de développement " (subdivision du compte 28 " Amortissements ") est débité en contrepartie du compte " Frais de développement ". Une subdivision du compte 20 " Logiciels informatiques et assimilés " est débitée :
      - du coût d'acquisition des licences se rapportant à l'utilisation de logiciels (dissociés du matériel) en contrepartie directement des comptes de tiers ou des comptes d'instruments de trésorerie et assimilés ; ou
      - du coût de production des logiciels créés en contrepartie d'un compte " Production immobilisée d'actif incorporel " subdivision du compte 72 (après enregistrement des charges les concernant dans les comptes par nature). Les autres éléments d'actif non courants incorporels s'enregistrent directement dans des subdivisions du compte 20 (en contrepartie des comptes de tiers ou des comptes d'instruments de trésorerie et assimilés) :
      - concessions et droits similaires, brevets, licences, marques, procédés, droits et valeurs similaires ;
      - fonds commercial ;
      - autres immobilisations incorporelles (droit au bail, ….). Les profits ou les pertes provenant de la mise hors service ou de la sortie d'une immobilisation incorporelle sont déterminés par différence entre les produits de sortie nets estimés et la valeur comptable de l'actif, et sont comptabilisés en produits ou en charges dans le compte de résultat dans les comptes 65 (subdivision pertes sur sorties d'actifs immobilisés) ou 75 (subdivision profits sur sorties d'actifs immobilisés).
