      Les éléments par nature figurant dans ces compte 75 sont réputés être constitutifs du résultat des activités ordinaires de l'entité. Lors d'une cession d'immobilisations autre que des titres, ce compte enregistre le montant, hors TVA collectée, du prix de cession des éléments d'actif cédés. Ce compte enregistre également au crédit :
      • la quote-part des subventions d'investissement virée au résultat de l'exercice ;
      • les redevances pour concessions, brevets, licences, marques, procédés, logiciels, droits et valeurs similaires ;
      • les rémunérations perçues par l'entité au titre de ses fonctions de direction (administrateur, gérant…) auprès d'autres entités du Groupe ;
      • les revenus des immeubles non affectés à des activités professionnelles ;
      • la quote-part de résultat sur opérations faites en commun ;
      • les indemnités d'assurances reçues ;
      • les dédits, pénalités, libéralités perçues ;
      • les plus values dégagées lors d'une cession d'actifs non courants.
