  - id: 15
    label: Provisions pour charges - Passifs non courants
    parent: 1
    description: |-
      Sont enregistrées distinctement au crédit de ce compte :
      - les provisions non courantes pour charges ;
      - les provisions pour engagements de retraite.
      Lors de la constitution d'une provision non courante pour charges, le compte de provision est crédité par le débit d'un compte de dotations, soit d'exploitation, soit financières.
      Lors de la survenance de la charge, la provision pour charges antérieurement constituée est soldée par le crédit d'un compte de reprise (78). Corrélativement, la charge intervenue est inscrite au compte intéressé de la classe 6.
      Le compte de provision pour charges est réajusté, en tout état de cause, à la fin de chaque exercice par :
      - le débit des comptes de dotations correspondants, lorsque le montant de la provision doit être augmenté ;
      - le crédit d'un compte 78 de reprise (produit), de même niveau que celui utilisé pour la dotation, lorsque le montant de la provision doit être diminué ou annulé (provision devenue, en tout ou partie, sans objet).
