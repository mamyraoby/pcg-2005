  - id: 59
    label: Pertes de valeur sur comptes financiers
    parent: 5
    description: |-
      La nature et le fonctionnement du compte 59 est comparable à celui du compte 49 : ce sont des comptes de correction de valeur, qui permettent de ramener la valeur comptable d'un actif à sa valeur recouvrable.
      En effet, comme tout autre actif, un actif financier non évalué à sa juste valeur à la clôture de la période doit être déprécié si sa valeur comptable est supérieure à sa valeur recouvrable. Les actifs financiers non évalués à leur juste valeur et devant donc être soumis à un test de dépréciation afin de constater une éventuelle perte de valeur correspondent :
      • aux prêts et créances émis par l'entreprise et non détenus à des fins de transaction ;
      • aux placements détenus jusqu'à leur échéance ;
      • à tout actif financier qui n'a pas de prix cotés sur un marché actif et dont la juste valeur ne peut être évaluée de façon fiable.
      Lors de leur constitution, les provisions pour la dépréciation des actifs enregistrés dans des comptes d'instruments de trésorerie et assimilés sont crédités au compte 59 "Pertes de valeur des comptes d'instruments de trésorerie et assimilés".
      En contrepartie, le compte de dotation financière doit être débité.
      Le compte de provision relatif aux comptes d'instruments de trésorerie et assimilés qui ne font pas l'objet d'une évaluation à leur juste valeur est réajusté à la fin de chaque exercice par :
      • le débit du compte de dotations, lorsque le montant de la provision doit être augmenté ;
      • le crédit du compte de reprise financière, lorsque le montant de la provision doit être diminué ou annulé (provision devenue, en tout ou partie, sans objet).
      A la date de la cession d'un instrument de trésorerie ou assimilé, la perte de valeur antérieurement constituée est soldée par le crédit du compte 78 (reprise sur provision).
