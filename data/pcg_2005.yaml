  - id: 47
    label: Comptes transitoires ou d'attente
    parent: 4
    description: |-
      Les comptes " 47 - Comptes transitoires ou d'attente " sont à la disposition des entités pour recevoir, en cours d'exercice, les opérations :
      • qui ne peuvent être imputées de façon certaine à un compte déterminé au moment où elles doivent être enregistrées ou ;
      • qui exigent une information complémentaire.
      Toute opération portée au compte 47 doit être imputée au compte définitif dans les délais les plus brefs. Ce compte est normalement soldé à la clôture de l'exercice.
  - id: 48
    label: Charges ou produits constatés d'avance et provisions
    parent: 4
    description: |-
      Ce compte peut présenter les subdivisions suivantes :
      • Charges constatées d'avance ;
      • Produits constatés d'avance ;
      • Provisions courantes pour charges. Les comptes "Charges constatées d'avance" et "Produits constatés d'avance" reçoivent, à la clôture de l'exercice, les charges et les produits concernant un exercice ultérieur (pour leur montant hors TVA). Ces comptes sont soldés, et les charges et produits sont imputés dans les comptes par nature concernés, au cours de l'exercice auquel ils se rapportent en application du principe d'indépendance des exercices.
      Provisions passifs courants
      A la clôture des comptes de la période, les passifs dont le montant est incertain et dont l'échéance se situe probablement dans les douze mois doivent faire l'objet d'un enregistrement comptable au crédit d'un compte 48 “Provisions - passifs courants” par le débit du compte de charges 68 “Dotations aux amortissements, provisions et perte de valeur”.
      Lorsque la charge qui a fait l'objet d'une provision est constatée, le compte de la classe 6 intéressé est débité par le crédit d'un compte financier (ou d'un compte de tiers), et le compte 48 provision est soldé par le crédit du compte de produit 78 “Reprises sur provisions et sur pertes de valeur”.
      La provision doit être également reprise si elle s'avère sans objet.
