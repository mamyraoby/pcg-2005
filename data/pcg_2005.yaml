  - id: 58
    label: Virements internes
    parent: 5
    description: |-
      Le compte 58 " Virements internes " est un compte de passage utilisé pour la comptabilisation d'opérations au terme desquelles il doit se trouver soldé.
      Ce compte est notamment destiné à permettre la centralisation, sans risque de double emploi :
      • des virements de fonds d'un compte de trésorerie (caisse ou banque) à un autre compte de trésorerie (banque ou caisse) ;
      • et, plus généralement, de toute opération devant faire l'objet d'un enregistrement dans plusieurs journaux auxiliaires.
