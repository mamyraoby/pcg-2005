  - id: 23
    label: Immobilisations en cours
    parent: 2
    description: |-
      Ces comptes ont pour objet de faire apparaître la valeur des immobilisations non achevées à la fin de chaque exercice, ainsi que les avances et acomptes versés par l'entreprise à des tiers en vue de l'acquisition d'une immobilisation.
      Ces comptes sont soldés lorsque l'immobilisation est achevée, avec pour contrepartie des comptes d'immobilisations (compte 21) Aucun amortissement ne peut être pratiqué sur des immobilisations en cours, mais une perte de valeur peut être constatée si compte tenu des changements d'estimation survenus au cours des travaux, la valeur recouvrable de l'immobilisation devient inférieure à sa valeur comptable.
      Les immobilisations en cours se répartissent en deux groupes :
      - les immobilisations qui résultent de travaux de plus ou moins longue durée confiés à des tiers ;
      - les immobilisations créées par les moyens propres de l'entreprise.
      a. Immobilisations acquises auprès des tiers Les immobilisations dont la réalisation est confiée à des tiers et qui ne sont pas achevées à la fin de l'exercice sont inscrites en immobilisations en cours en contrepartie des comptes de tiers concernés (comptes classe 4), sur la base des factures ou des décomptes de travaux fournis par ces tiers.
      b. Immobilisations créées par les moyens propres de l'entité Les immobilisations créées par les moyens propres de l'entité et non achevées à la fin de l'exercice sont inscrites en immobilisations en cours en contrepartie d'un compte 72 " production immobilisée " pour le coût de production des éléments en cours (après enregistrement des charges dans les comptes de charge correspondant, comptes classe 6).
      Avances et acomptes versés sur commandes d'immobilisations
      Les avances et acomptes versés à des tiers dans le cadre de l'acquisition d'immobilisations sont également portés dans une subdivision du compte 23 " Avances et acomptes versés sur commandes d'immobilisations". Les entités ont également la faculté de comptabiliser en cours d'exercice ces avances et acomptes dans une subdivision du compte 40 intitulé " Fournisseurs - avances et acomptes versés sur commandes", à condition en fin d'exercice de virer ces avances et acomptes en compte 23 afin qu'ils apparaissent au bilan sous la rubrique immobilisations.
