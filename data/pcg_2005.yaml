  - id: 65
    label: Autres charges des activités ordinaires
    parent: 6
    description: |-
      Les éléments par nature figurant dans ce compte sont réputés être constitutifs du résultat des activités ordinaires de l'entité.
      Lors d'une sortie d'immobilisations, sont inscrits dans une subdivision de ce compte :
      • au débit, la valeur brute des éléments d'actifs cédés ;
      • au crédit, le montant des amortissements et pertes de valeurs desdits éléments.
      Ce compte enregistre également :
      • les redevances pour concessions, brevets, licences, marques, procédés, logiciels, droits et valeurs similaires ;
      • les rémunérations des administrateurs relatives à leur fonction ;
      • les pertes sur créances irrécouvrables ;
      • la quote-part de résultat sur opérations faites en commun ;
      • les pénalités sur marché, les amendes fiscales ou pénales ;
      • les moins-values dégagées lors d'une cession de titres immobilisés.
