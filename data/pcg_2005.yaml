  - id: 41
    label: Clients et comptes rattachés
    parent: 4
    description: |-
      Figurent sous le compte 41, les créances liées à la vente de biens ou services rattachés au cycle d'exploitation de l'entité. Selon les besoins de la gestion et de l'information financière, des subdivisions du compte 41 peuvent être ouvertes telles que :
      • clients ;
      • clients douteux ;
      • effets à recevoir ;
      • effets escomptés non échus ;
      • clients, emballages et matériels prêtés ;
      • clients, produits à recevoir ;
      • rabais, remises, ristournes et autres avoirs à accorder ;
      • avances et acomptes reçus sur commandes.
      Le compte " Clients " :
      • est débité du montant des factures de ventes de biens ou de prestations de services par le crédit :
      - de l'une des subdivisions du compte 70 " Ventes de produits fabriqués et de marchandises " ou du compte 71 " Ventes de prestations de services et produits annexes " (montant hors TVA collecté),
      - d'une subdivision du compte 41 pour les dettes au titre des emballages et matériels consignés, et
      - d'une subdivision du compte 44 au titre de la TVA collectée ;
      • est crédité par le débit :
      - d'un compte de trésorerie lors des règlements reçus des clients,
      - de l'une des subdivisions du compte 70 ou du compte 71 pour le montant des avoirs établis par l'entité lors du retour de marchandises par les clients, ou pour le montant des rabais, remises et ristournes accordés (et du compte de TVA concerné),
      - du compte " Effets à recevoir " lors de l'acceptation par les clients d'une lettre de change ou de la réception d'un billet à ordre,
      - d'une subdivision du compte 41 pour les avances et acomptes reçus sur commandes (pour solde de ces derniers).
      Le compte " Effets à recevoir " est débité par le crédit du compte "Clients" au moment de l'entrée des effets en portefeuille. Ce compte est crédité :
      • à l'échéance de l'effet, par le débit d'un compte de trésorerie ;
      • en cas de remise à l'escompte, par le débit d'une subdivision du compte 41 " Effets escomptés non échus " et par le débit d'un compte de charges financières pour la partie relative aux intérêts d'escompte.
      En cas de non-paiement à l'échéance, le montant des effets est ré imputé au débit du compte " Clients " en contrepartie du compte " Effets à recevoir ".
      Le compte " Clients douteux " est débité par le crédit du compte ”Clients " pour le montant total des créances que l'entité possède à l'encontre notamment de clients dont la solvabilité apparaît douteuse ou litigieuse.
      Les subdivisions du compte 41 “Créances sur travaux non encore facturables” enregistrent au débit la contrepartie des produits nets partiels hors taxes constatés au cours de la réalisation d'un contrat à long terme.
      Les subdivisions du compte 41 - “Produits non encore facturés (ou factures à établir)” sont débitées, à la clôture de la période comptable, du montant taxes comprises des créances imputables à la période close et pour lesquelles les pièces justificatives (factures, décompte…) n'ont pas encore été établies.
      Ces comptes sont crédités lors de l'établissement des factures par le débit des comptes de tiers concernés.
      La subdivision du compte 41 " Rabais, remises, ristournes à accorder et autres avoirs à établir " enregistre au crédit (TVA comprise) à la clôture de l'exercice les avoirs à établir imputables à la période close, dont le montant est suffisamment connu et évaluable, par le débit des comptes concernés des classes 4 et 7.
      La subdivision du compte "Clients, emballages et matériels prêtés " est créditée des créances correspondant aux montants facturés par l'entité à ses clients au titre des consignations d'emballages ou de matériel, en contrepartie du compte " Clients ".
      Il est débité du même montant :
      • par le crédit du compte " Clients ", en cas de restitution de l'emballage ;
      • par le crédit des comptes intéressés de la classe 7, dans le cas où l'emballage serait conservé par le client (cessions d'immobilisations ou d'approvisionnement en fonction du mode de comptabilisation retenu pour les emballages) ;
      • par le crédit du compte " client " et d'une subdivision du compte 71 - " Bonis sur reprises d'emballages consignés ", lorsque la reprise est effectuée pour un prix inférieur à celui de la consignation.
