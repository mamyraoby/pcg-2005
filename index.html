<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCG 2005 – Madagascar</title>
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ---------- Tokens (flat) ---------- */
:root{
  --bg:#f4f6f9;--card:#ffffff;--sub:#eef1f5;
  --t:#111827;--m:#667085;
  --p:#2563eb;--pd:#1d4ed8;--ptint:#e8f0fe;
  --line:#e2e6ec;
  --mark:#fde68a;
  --ok:#16a34a;--bad:#dc2626;
  --r-lg:16px;--r-md:12px;--r-sm:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--sub:#21252d;
  --t:#f1f3f7;--m:#9aa3b2;
  --p:#3b82f6;--pd:#8ab4ff;--ptint:#1c2a45;
  --line:#2a2f39;
  --mark:#7a5d0a;
  --ok:#4ade80;--bad:#f87171;
}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--t);background:var(--bg);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* flat surface */
.glass{background:var(--card);border:1px solid var(--line)}

/* ---------- Layout ---------- */
header{max-width:980px;margin:0 auto;padding:32px 20px 16px}
header h1{margin:0;font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
header p{margin:6px 0 0;color:var(--m);font-size:1rem}
main{max-width:980px;margin:0 auto;padding:0 14px 48px}
header{padding-bottom:20px}

.ctl{position:sticky;top:0;z-index:20;width:100%;background:var(--card);border-bottom:1px solid var(--line)}
.ctl-in{max-width:980px;margin:0 auto;padding:12px 14px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--card);z-index:30}
.sr{position:relative}
.sr svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--m);pointer-events:none}
input[type=search]{
  width:100%;font:inherit;font-size:1.05rem;color:var(--t);
  padding:12px 14px 12px 42px;border:2px solid transparent;border-radius:var(--r-md);outline:0;
  background:var(--sub);transition:border-color .15s,background .15s;
}
input[type=search]::placeholder{color:var(--m)}
input[type=search]:focus{border-color:var(--p);background:var(--card)}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}

/* class chips */
.chips{display:flex;gap:8px;margin-top:12px;padding:2px 2px 4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:7px;
  padding:5px 14px 5px 5px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--t);
  background:var(--card);border:1px solid var(--line);transition:background .15s,border-color .15s,color .15s;
}
.chips button i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ptint);color:var(--pd);font-size:.74rem;font-weight:700}
.chips button:hover{border-color:var(--p)}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.chips button.on i{background:rgba(255,255,255,.22);color:#fff}

/* segmented control */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-top:10px;padding:3px;border-radius:var(--r-md);background:var(--sub)}
.seg .thumb{
  position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:var(--r-sm);
  background:var(--card);border:1px solid var(--line);
  transition:transform .25s ease;
}
.seg[data-v="T"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:8px 12px;border-radius:var(--r-sm);font-weight:600;font-size:.95rem;color:var(--m);transition:color .15s}
.seg button.on{color:var(--p)}

.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 6px 10px;color:var(--m);font-size:.9rem}

/* ---------- Results ---------- */
ul{list-style:none;margin:0;padding:0}
.res{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color .15s,background .15s;
}
.res:hover{border-color:var(--p)}
.code{
  flex:none;min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--pd);background:var(--ptint);border-radius:var(--r-sm);padding:5px 10px;
}
.lbl{font-weight:600}
.info{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:6px;border-radius:50%;background:var(--ptint);color:var(--pd);font-size:.68rem;font-weight:700;vertical-align:1px}
.path{font-size:.8rem;color:var(--m);margin-top:3px}
.snip{font-size:.84rem;color:var(--m);margin-top:6px;padding-left:10px;border-left:3px solid var(--ptint)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--m);padding:34px 10px}

/* tree */
.tree{border-radius:var(--r-lg);padding:12px}
.tree li{margin:2px 0}
.tree details>summary{cursor:pointer;padding:8px 10px;border-radius:var(--r-sm);list-style:none}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary:hover,.tree .leaf:hover{background:var(--ptint)}
.tree .leaf{padding:8px 10px 8px 26px;border-radius:var(--r-sm);cursor:pointer}
.tree ul{margin-left:18px;border-left:2px solid var(--line);padding-left:6px}
.tree summary::before{content:"›";display:inline-block;width:16px;color:var(--p);font-weight:700;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree b{color:var(--pd);margin-right:6px;font-variant-numeric:tabular-nums}

/* ---------- Detail sheet ---------- */
dialog{
  border:1px solid var(--line);border-radius:var(--r-lg);padding:0;color:var(--t);
  width:calc(100% - 24px);max-width:640px;max-height:88vh;overflow:hidden;background:var(--card);
}
dialog[open]{display:flex;flex-direction:column;animation:sheet .2s ease}
dialog::backdrop{background:rgba(15,23,42,.5)}
@keyframes sheet{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dh{position:relative;padding:20px 62px 16px 22px;border-bottom:1px solid var(--line)}
.dh .code{display:inline-block;margin-bottom:8px}
.dh .ttl{font-size:1.2rem;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.x{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:var(--r-sm);padding:0;display:grid;place-items:center;
  background:var(--sub);border:0;color:var(--m);font-size:.95rem;transition:background .15s
}
.x:hover{background:var(--ptint);color:var(--p)}
.db{padding:4px 22px 22px;overflow:auto;overscroll-behavior:contain}
.db h4{margin:20px 0 8px;font-size:.95rem;font-weight:700;color:var(--pd)}
.db .res{margin-bottom:6px}
.desc{padding:14px 16px;border-radius:var(--r-md);background:var(--sub);font-size:.95rem;line-height:1.6}
.desc p{margin:0 0 10px}.desc p:last-child,.desc ul:last-child{margin-bottom:0}
.desc h5{margin:14px 0 6px;font-size:.95rem;font-weight:700}
.desc h5:first-child{margin-top:0}
.desc ul{list-style:disc;padding-left:20px;margin:0 0 10px}
.desc li{margin:3px 0}
.note{font-size:.82rem;color:var(--m);margin:0 0 8px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:20px}

/* copy button */
.copy{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;font-weight:600;
  border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);color:var(--pd);
  transition:background .2s,color .2s,border-color .2s,transform .12s
}
.copy:hover{border-color:var(--p)}
.copy:active{transform:scale(.96)}
.copy.main{background:var(--p);border-color:var(--p);color:#fff}
.copy.main:hover{background:var(--pd);border-color:var(--pd)}
.copy .ci{display:inline-block}

/* stacked, push-style copy notifications */
#notifications{
  position:fixed;z-index:9999;top:calc(20px + env(safe-area-inset-top));left:50%;right:auto;bottom:auto;
  margin:0;display:flex;flex-direction:column;gap:10px;transform:translateX(-50%);
  width:min(360px,calc(100vw - 32px));pointer-events:none;background:transparent;color:inherit;border:0;padding:0;overflow:visible;
}
#notifications:popover-open{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;right:auto;bottom:auto;margin:0;transform:translateX(-50%)}
.notification{
  display:grid;grid-template-columns:38px minmax(0,1fr) 28px;align-items:start;gap:11px;
  padding:14px;background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--t);
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:14px;
  box-shadow:0 8px 28px rgba(15,23,42,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transform:translateX(18px);transition:opacity .2s ease,transform .2s ease;
}
.notification.show{opacity:1;transform:translateX(0)}
.notification-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--ptint);color:var(--p);font-weight:800}
.notification.error .notification-icon{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.notification-title{font-size:.88rem;font-weight:750;line-height:1.3}
.notification-detail{margin-top:3px;color:var(--m);font-size:.82rem;line-height:1.4;overflow-wrap:anywhere}
.notification-close{border:0;background:transparent;color:var(--m);padding:2px;font-size:1.1rem;line-height:1}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media(max-width:520px){
  header{padding:24px 16px 12px}
  .code{min-width:52px}
  .acts .copy{flex:1;justify-content:center}
}
</style>
</head>
<body>
<header><h1>Plan Comptable Général 2005</h1><p>Madagascar · Recherche par code, libellé ou description</p></header>
<div class="ctl"><div class="ctl-in">
  <div class="sr">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
    <input id="q" type="search" placeholder="Ex. 4457, 512, « capital », « TVA »…" autocomplete="off" autofocus aria-label="Rechercher un compte">
  </div>
  <div class="chips" id="cls"></div>
  <div class="seg" id="seg" role="tablist" aria-label="Mode d'affichage" data-v="S">
    <span class="thumb" aria-hidden="true"></span>
    <button id="vS" role="tab" aria-selected="true" class="on">Résultats</button>
    <button id="vT" role="tab" aria-selected="false">Arborescence</button>
  </div>
</div></div>
<main>
<div class="bar"><span id="cnt"></span></div>
<div id="out"></div>
</main>
<dialog id="dlg"></dialog>
<script>
const URL_='data/pcg_2005.json';
const CLASSES={1:'Capitaux',2:'Immobilisations',3:'Stocks',4:'Tiers',5:'Financiers',6:'Charges',7:'Produits'};
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
let tree=[],flat=[],byId=new Map(),cls=0,view='S';

function build(nodes,parent){nodes.forEach(n=>{
  const o={code:String(n.id),label:n.label||'(Libellé non défini)',empty:!n.label,desc:n.description||'',parent,kids:[]};
  o.n=norm(o.label);o.nd=norm(o.desc);byId.set(o.code,o);flat.push(o);if(parent)parent.kids.push(o);
  if(n.children)build(n.children,o);});}
const path=o=>{const a=[];for(let p=o.parent;p;p=p.parent)a.unshift(p);return a};
/* own description, or the closest ancestor's */
function descOf(o){
  if(o.desc)return{text:o.desc,from:o,inherited:false};
  for(let p=o.parent;p;p=p.parent)if(p.desc)return{text:p.desc,from:p,inherited:true};
  return null;
}

function hl(text,terms){
  let h=esc(text);if(!terms.length)return h;
  const nt=norm(text);const ranges=[];
  terms.forEach(t=>{let i=nt.indexOf(t);while(i>=0&&t){ranges.push([i,i+t.length]);i=nt.indexOf(t,i+t.length)}});
  if(!ranges.length||nt.length!==text.length)return h;
  ranges.sort((a,b)=>a[0]-b[0]);let out='',pos=0;
  for(const[a,b]of ranges){if(a<pos)continue;out+=esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';pos=b}
  return out+esc(text.slice(pos));
}
function snippet(o,terms){
  const flatTxt=o.desc.replace(/\s*\n\s*/g,' ');
  const nt=norm(flatTxt);
  let i=terms.length?nt.indexOf(terms[0]):-1;
  if(i<0||nt.length!==flatTxt.length)return flatTxt.slice(0,140)+(flatTxt.length>140?'…':'');
  const a=Math.max(0,i-45),b=Math.min(flatTxt.length,i+110);
  return(a>0?'…':'')+flatTxt.slice(a,b)+(b<flatTxt.length?'…':'');
}
function item(o,terms,qd,snip){
  const p=path(o).map(x=>x.code+' '+x.label).join(' › ');
  const code=qd&&o.code.startsWith(qd)?'<mark>'+qd+'</mark>'+o.code.slice(qd.length):o.code;
  return `<li class="res" data-c="${o.code}"><span class="code">${code}</span><div><div class="lbl">${hl(o.label,terms)}${o.desc?'<span class="info" title="Description disponible">i</span>':''}</div><div class="path">${esc(p)||'Classe '+o.code}</div>${snip?`<div class="snip">${hl(snippet(o,terms),terms)}</div>`:''}</div></li>`;
}
function search(){
  const raw=$('q').value.trim(),q=norm(raw),terms=q.split(/\s+/).filter(Boolean);
  const qd=/^\d+$/.test(raw)?raw:'';
  let list=flat.filter(o=>!cls||o.code[0]==cls);
  if(view==='T'){renderTree(list,q);return}
  if(!q){$('cnt').textContent=`${list.length} comptes · tapez pour rechercher`;
    $('out').innerHTML='<ul>'+list.filter(o=>o.code.length<=2).map(o=>item(o,[],'')).join('')+'</ul>';return}
  const inDesc=new Set();
  if(qd){list=list.filter(o=>o.code.startsWith(qd))}
  else{
    list=list.filter(o=>{
      if(terms.every(t=>o.n.includes(t)||o.code.startsWith(t)))return true;
      if(o.nd&&terms.every(t=>o.nd.includes(t))){inDesc.add(o);return true}
      return false;
    });
  }
  list.sort((a,b)=>(inDesc.has(a)-inDesc.has(b))||a.code.length-b.code.length||a.code.localeCompare(b.code));
  const nd=inDesc.size;
  $('cnt').textContent=`${list.length} résultat${list.length>1?'s':''}`+(nd?` · dont ${nd} dans les descriptions`:'');
  const shown=list.slice(0,150);
  $('out').innerHTML=shown.length?'<ul>'+shown.map(o=>item(o,qd?[]:terms,qd,inDesc.has(o))).join('')+'</ul>'+(list.length>150?'<div class="empty">Affichage limité à 150 résultats – affinez votre recherche.</div>':''):'<div class="empty">Aucun compte trouvé.</div>';
}
function renderTree(list,q){
  const raw=$('q').value.trim();
  const terms=q.split(/\s+/).filter(Boolean);
  const match=o=>!q||(/^\d+$/.test(raw)?o.code.startsWith(raw):(terms.every(t=>o.n.includes(t))||(o.nd&&terms.every(t=>o.nd.includes(t)))));
  const vis=o=>match(o)||o.kids.some(vis);
  const open=!!q;
  const li=o=>{if(!vis(o))return'';
    const t=`<b>${o.code}</b>${esc(o.label)}${o.desc?'<span class="info" title="Description disponible">i</span>':''}`;
    if(!o.kids.length)return`<li><div class="leaf" data-c="${o.code}">${t}</div></li>`;
    return`<li><details ${open?'open':''}><summary data-c="${o.code}">${t}</summary><ul>${o.kids.map(li).join('')}</ul></details></li>`};
  const html=tree.filter(r=>!cls||r.code==cls).map(li).join('');
  $('cnt').textContent='Arborescence hiérarchique';
  $('out').innerHTML=`<div class="glass tree"><ul>${html||'<div class="empty">Aucun compte trouvé.</div>'}</ul></div>`;
}

/* description text → paragraphs, bullet lists, small sub-headings */
function renderDesc(text){
  const lines=text.split('\n');let html='',ul=[];
  const flush=()=>{if(ul.length){html+='<ul>'+ul.map(x=>`<li>${x}</li>`).join('')+'</ul>';ul=[]}};
  for(const raw of lines){
    const l=raw.trim();if(!l)continue;
    const b=l.match(/^(?:[•–]|-|\.)\s+(.*)$/);
    if(b){ul.push(esc(b[1]));continue}
    flush();
    const sub=l.match(/^[a-d]\.\s+(.*)$/);
    if(sub){html+=sub[1].length<90?`<h5>${esc(sub[1])}</h5>`:`<p>${esc(sub[1])}</p>`;continue}
    html+=`<p>${esc(l)}</p>`;
  }
  flush();return html;
}

let notificationStack;
function notifyCopy(account,withDescription,success){
  if(!notificationStack){notificationStack=document.createElement('div');notificationStack.id='notifications';if('popover' in notificationStack)notificationStack.popover='manual';document.body.appendChild(notificationStack)}
  try{if(notificationStack.showPopover&&!notificationStack.matches(':popover-open'))notificationStack.showPopover()}catch(_){}
  const card=document.createElement('div');card.className='notification'+(success?'':' error');
  card.setAttribute('role','status');card.setAttribute('aria-live','polite');
  const icon=document.createElement('div');icon.className='notification-icon';icon.textContent=success?'✓':'!';
  const body=document.createElement('div');
  const title=document.createElement('div');title.className='notification-title';title.textContent=success?'Copié':'Échec de la copie';
  const detail=document.createElement('div');detail.className='notification-detail';
  detail.textContent=account.code+' · '+account.label+(withDescription?' · avec description':'');
  body.append(title,detail);
  const close=document.createElement('button');close.className='notification-close';close.type='button';close.setAttribute('aria-label','Fermer la notification');close.textContent='×';
  close.style.pointerEvents='auto';close.addEventListener('click',()=>dismissNotification(card));
  card.append(icon,body,close);notificationStack.insertBefore(card,notificationStack.firstChild);
  while(notificationStack.children.length>2){const oldest=notificationStack.lastElementChild;clearTimeout(oldest._dismissTimer);oldest.remove()}
  requestAnimationFrame(()=>card.classList.add('show'));
  const timer=setTimeout(()=>dismissNotification(card),4200);card._dismissTimer=timer;
}
function dismissNotification(card){
  if(!card.isConnected)return;
  clearTimeout(card._dismissTimer);card.classList.remove('show');
  setTimeout(()=>{card.remove();if(notificationStack&&!notificationStack.children.length){try{notificationStack.hidePopover&&notificationStack.hidePopover()}catch(_){}}},220);
}
async function copyText(txt){
  let ok=true;
  try{await navigator.clipboard.writeText(txt)}catch(e){
    try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(_){ok=false}
  }
  return ok;
}
function detail(c){
  const o=byId.get(c);if(!o)return;
  const d=$('dlg'),ds=descOf(o);
  let descHtml='';
  if(ds){
    descHtml=ds.inherited
      ?`<h4>Fonctionnement du compte ${ds.from.code}</h4><p class="note">Ce compte n'a pas de description propre : voici celle du compte ${ds.from.code} – ${esc(ds.from.label)}.</p>`
      :'<h4>Description</h4>';
    descHtml+=`<div class="desc">${renderDesc(ds.text)}</div>`;
  }
  d.innerHTML=`<div class="dh"><button class="x" onclick="dlg.close()" aria-label="Fermer">✕</button><span class="code">${o.code}</span><div class="ttl">${esc(o.label)}</div></div>
  <div class="db"><div class="path">${esc(path(o).map(x=>x.code+' '+x.label).join(' › '))||'Classe '+o.code}</div>
  ${descHtml}
  ${o.parent?`<h4>Compte parent</h4><ul>${item(o.parent,[],'')}</ul>`:''}
  <h4>Sous-comptes (${o.kids.length})</h4>${o.kids.length?'<ul>'+o.kids.map(k=>item(k,[],'')).join('')+'</ul>':'<div class="path">Aucun sous-compte.</div>'}
  <div class="acts">${ds?'<button class="copy" data-copy="desc" data-c0="'+o.code+'"><span class="ci">⧉</span><span class="ct">Copier la description</span></button>':''}<button class="copy main" data-copy="code" data-c0="${o.code}"><span class="ci">⧉</span><span class="ct">Copier</span></button></div></div>`;
  d.querySelector('.db').scrollTop=0;
  if(!d.open)d.showModal();
  d.querySelector('.db').scrollTop=0;
}
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){const o=byId.get(cp.dataset.c0),withDescription=cp.dataset.copy==='desc';
    const ds=withDescription?descOf(o):null;
    const txt=withDescription?o.code+' - '+o.label+'\n\n'+ds.text:o.code+' - '+o.label;
    copyText(txt).then(ok=>notifyCopy(o,withDescription,ok));
    return}
  const el=e.target.closest('[data-c]');if(!el)return;
  if(el.tagName==='SUMMARY'&&e.target.closest('summary')&&!e.target.closest('b')&&!e.shiftKey){return}
  detail(el.dataset.c);
});
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('q').addEventListener('input',search);
function setView(v){
  view=v;$('seg').dataset.v=v;
  [['S','vS'],['T','vT']].forEach(([k,id])=>{
    const b=$(id),on=k===v;
    b.classList.toggle('on',on);b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;
  });
  search();
}
$('vS').onclick=()=>setView('S');
$('vT').onclick=()=>setView('T');
$('seg').addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const v=view==='S'?'T':'S';setView(v);$(v==='S'?'vS':'vT').focus()}
});
$('vT').tabIndex=-1;
function chips(){
  $('cls').innerHTML=['<button data-k="0" class="on"><i>☰</i>Toutes</button>'].concat(Object.entries(CLASSES).map(([k,v])=>`<button data-k="${k}"><i>${k}</i>${v}</button>`)).join('');
  $('cls').onclick=e=>{const b=e.target.closest('button');if(!b)return;cls=+b.dataset.k;
    $('cls').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));search()};
}
chips();
$('cnt').textContent='Chargement des données…';
fetch(URL_).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  build(j,null);tree=flat.filter(o=>!o.parent);search();
}).catch(()=>{$('cnt').textContent='';
  $('out').innerHTML='<div class="empty">Impossible de charger les données. Connectez-vous à Internet pour le premier chargement, puis réessayez.</div>'});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(error=>{
      console.error('Échec de l’enregistrement du service worker:',error);
    });
  });
}
</script>
