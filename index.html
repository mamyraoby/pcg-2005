<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCG 2005 – Madagascar</title>
<style>
:root{--bg:#eaf4fd;--card:#fff;--p:#2b8ad6;--pd:#1766ad;--pl:#d6eafb;--t:#16324a;--m:#5f7b93;--b:#c3dcf2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,#4fa8ec,#2b8ad6);color:#fff;padding:22px 16px 56px;text-align:center}
header h1{margin:0;font-size:1.6rem}header p{margin:6px 0 0;opacity:.92;font-size:.95rem}
main{max-width:980px;margin:-36px auto 40px;padding:0 14px}
.box{background:var(--card);border-radius:14px;box-shadow:0 4px 18px rgba(30,100,170,.14);padding:14px}
.sr{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font-size:1.05rem;padding:12px 14px;border:2px solid var(--b);border-radius:10px;outline:0}
input[type=search]:focus{border-color:var(--p)}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--pl);color:var(--pd);border-radius:999px;padding:6px 13px}
button.on{background:var(--p);color:#fff;border-color:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 2px 8px;color:var(--m);font-size:.9rem}
ul{list-style:none;margin:0;padding:0}
.res{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--b);border-radius:10px;cursor:pointer}
.res:hover{border-color:var(--p);background:#f5faff}
.code{flex:none;min-width:62px;text-align:center;background:var(--pl);color:var(--pd);font-weight:700;border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.lbl{font-weight:600}.path{font-size:.8rem;color:var(--m);margin-top:3px}
mark{background:#ffe58f;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--m);padding:30px 10px}
.tree li{margin:2px 0}
.tree details>summary{cursor:pointer;padding:6px 8px;border-radius:8px;list-style:none}
.tree details>summary:hover,.tree .leaf:hover{background:var(--pl)}
.tree .leaf{padding:6px 8px 6px 22px;border-radius:8px;cursor:pointer}
.tree ul{margin-left:16px;border-left:2px solid var(--b);padding-left:6px}
.tree summary::before{content:"▸ ";color:var(--p)}.tree details[open]>summary::before{content:"▾ "}
.tree b{color:var(--pd);margin-right:6px}
dialog{border:0;border-radius:16px;max-width:560px;width:calc(100% - 28px);padding:0;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(22,50,74,.45)}
.dh{background:var(--p);color:#fff;padding:16px 18px}.dh .code{display:inline-block;background:#fff;margin-bottom:6px}
.db{padding:16px 18px;max-height:60vh;overflow:auto}
.db h4{margin:14px 0 6px;color:var(--pd)}.db .res{margin-bottom:6px}
.x{float:right;background:#fff3;color:#fff;border:0}
@media(max-width:520px){header h1{font-size:1.25rem}.code{min-width:52px}}
</style>
</head>
<body>
<header><h1>Plan Comptable Général 2005</h1><p>Madagascar · Recherche par code ou par libellé</p></header>
<main>
<div class="box">
  <div class="sr"><input id="q" type="search" placeholder="Ex. 4457, 512, « capital », « fournisseurs »…" autocomplete="off" autofocus></div>
  <div class="chips" id="cls"></div>
  <div class="chips"><button id="vS" class="on">Résultats</button><button id="vT">Arborescence</button></div>
</div>
<div class="bar"><span id="cnt"></span></div>
<div id="out"></div>
</main>
<dialog id="dlg"></dialog>
<script>
const URL_='https://raw.githubusercontent.com/mamyraoby/pcg-2005/refs/heads/main/data/pcg_2005.json';
const CLASSES={1:'Capitaux',2:'Immobilisations',3:'Stocks',4:'Tiers',5:'Financiers',6:'Charges',7:'Produits'};
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
let tree=[],flat=[],byId=new Map(),cls=0,view='S';

function build(nodes,parent){nodes.forEach(n=>{
  const o={code:String(n.id),label:n.label||'(Libellé non défini)',empty:!n.label,parent,kids:[]};
  o.n=norm(o.label);byId.set(o.code,o);flat.push(o);if(parent)parent.kids.push(o);
  if(n.children)build(n.children,o);});}
const path=o=>{const a=[];for(let p=o.parent;p;p=p.parent)a.unshift(p);return a};

function hl(text,terms){
  let h=esc(text);if(!terms.length)return h;
  const nt=norm(text);const ranges=[];
  terms.forEach(t=>{let i=nt.indexOf(t);while(i>=0&&t){ranges.push([i,i+t.length]);i=nt.indexOf(t,i+t.length)}});
  if(!ranges.length||nt.length!==text.length)return h;
  ranges.sort((a,b)=>a[0]-b[0]);let out='',pos=0;
  for(const[a,b]of ranges){if(a<pos)continue;out+=esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';pos=b}
  return out+esc(text.slice(pos));
}
function item(o,terms,qd){
  const p=path(o).map(x=>x.code+' '+x.label).join(' › ');
  const code=qd&&o.code.startsWith(qd)?'<mark>'+qd+'</mark>'+o.code.slice(qd.length):o.code;
  return `<li class="res" data-c="${o.code}"><span class="code">${code}</span><div><div class="lbl">${hl(o.label,terms)}</div><div class="path">${esc(p)||'Classe '+o.code}</div></div></li>`;
}
function search(){
  const raw=$('q').value.trim(),q=norm(raw),terms=q.split(/\s+/).filter(Boolean);
  const qd=/^\d+$/.test(raw)?raw:'';
  let list=flat.filter(o=>!cls||o.code[0]==cls);
  if(view==='T'){renderTree(list,q);return}
  if(!q){$('cnt').textContent=`${list.length} comptes · tapez pour rechercher`;
    $('out').innerHTML='<ul>'+list.filter(o=>o.code.length<=2).map(o=>item(o,[],'')).join('')+'</ul>';return}
  list=list.filter(o=>qd?o.code.startsWith(qd):terms.every(t=>o.n.includes(t)||o.code.startsWith(t)));
  list.sort((a,b)=>a.code.length-b.code.length||a.code.localeCompare(b.code));
  $('cnt').textContent=`${list.length} résultat${list.length>1?'s':''}`;
  const shown=list.slice(0,150);
  $('out').innerHTML=shown.length?'<ul>'+shown.map(o=>item(o,qd?[]:terms,qd)).join('')+'</ul>'+(list.length>150?'<div class="empty">Affichage limité à 150 résultats – affinez votre recherche.</div>':''):'<div class="empty">Aucun compte trouvé.</div>';
}
function renderTree(list,q){
  const ok=new Set();const raw=$('q').value.trim();
  const terms=q.split(/\s+/).filter(Boolean);
  const match=o=>!q||(/^\d+$/.test(raw)?o.code.startsWith(raw):terms.every(t=>o.n.includes(t)));
  const vis=o=>match(o)||o.kids.some(vis);
  const open=!!q;
  const li=o=>{if(!vis(o))return'';
    const t=`<b>${o.code}</b>${esc(o.label)}`;
    if(!o.kids.length)return`<li><div class="leaf" data-c="${o.code}">${t}</div></li>`;
    return`<li><details ${open?'open':''}><summary data-c="${o.code}">${t}</summary><ul>${o.kids.map(li).join('')}</ul></details></li>`};
  const html=tree.filter(r=>!cls||r.code==cls).map(li).join('');
  $('cnt').textContent='Arborescence hiérarchique';
  $('out').innerHTML=`<div class="box tree"><ul>${html||'<div class="empty">Aucun compte trouvé.</div>'}</ul></div>`;
}
function detail(c){
  const o=byId.get(c);if(!o)return;
  const d=$('dlg');
  d.innerHTML=`<div class="dh"><button class="x" onclick="dlg.close()">✕</button><span class="code">${o.code}</span><div style="font-size:1.15rem;font-weight:600">${esc(o.label)}</div></div>
  <div class="db"><div class="path">${esc(path(o).map(x=>x.code+' '+x.label).join(' › '))||'Classe '+o.code}</div>
  ${o.parent?`<h4>Compte parent</h4><ul>${item(o.parent,[],'')}</ul>`:''}
  <h4>Sous-comptes (${o.kids.length})</h4>${o.kids.length?'<ul>'+o.kids.map(k=>item(k,[],'')).join('')+'</ul>':'<div class="path">Aucun sous-compte.</div>'}
  <p style="text-align:right"><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${o.code} - '+byId.get('${o.code}').label)">Copier</button></p></div>`;
  d.showModal();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-c]');if(!el)return;
  if(el.tagName==='SUMMARY'&&e.target.closest('summary')&&!e.target.closest('b')&&!e.shiftKey){return}
  if(el.closest('dialog')){$('dlg').close()}
  detail(el.dataset.c);
});
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('q').addEventListener('input',search);
$('vS').onclick=()=>{view='S';$('vS').classList.add('on');$('vT').classList.remove('on');search()};
$('vT').onclick=()=>{view='T';$('vT').classList.add('on');$('vS').classList.remove('on');search()};
function chips(){
  $('cls').innerHTML=['<button data-k="0" class="on">Toutes</button>'].concat(Object.entries(CLASSES).map(([k,v])=>`<button data-k="${k}">${k} · ${v}</button>`)).join('');
  $('cls').onclick=e=>{const b=e.target.closest('button');if(!b)return;cls=+b.dataset.k;
    $('cls').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));search()};
}
chips();
$('cnt').textContent='Chargement des données…';
fetch(URL_).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  build(j,null);tree=flat.filter(o=>!o.parent);search();
}).catch(()=>{$('cnt').textContent='';
  $('out').innerHTML='<div class="empty">Impossible de charger les données depuis GitHub. Vérifiez votre connexion et rechargez la page.</div>'});
</script>
</body>
</html>
